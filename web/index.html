<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Vanguard Relay</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<style>
/* Layout: gold framed glass panels on a dark field. Left: orbital core and fleet dock. Centre: mission stream and chat.
   Right: needs attention and goals. The live hologram sits inside the orbital panel; nothing floats loose over it. */
:root{color-scheme:dark;--void:#020306;--panel:#080a10e6;--gold-core:#fff9db;--gold-hi:#fde68a;--gold:#f59e0b;--gold-deep:#b45309;
  --gold-border:#f59e0b73;--gold-border-hot:#fde688e0;--line:#f59e0b3d;
  --ink:#f8f6f0;--ink2:#cbd5e1;--ink3:#7b8798;--ok:#34d399;--bad:#fb8d7e;--warn:#fbbf24;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--display:"Rajdhani","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{overflow:hidden;background:radial-gradient(circle at 50% 20%,#f59e0b12 0,var(--void) 70%)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold-hi)}
code{font:400 12px var(--mono);color:var(--gold-hi)}
.muted{color:var(--ink3)}.small{font:400 11.5px/1.55 var(--mono)}.grow{flex:1;min-width:0}.spacer{flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:1px solid var(--gold-hi);outline-offset:2px}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{height:58px;flex:none;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid #f59e0b3d;background:#04060af0;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand svg{width:30px;height:30px;flex:none;filter:drop-shadow(0 0 10px #f59e0b80)}
.brand b{font:700 20px/1 var(--display);letter-spacing:.2em}
.brand span{font:500 10px var(--mono);letter-spacing:.18em;color:var(--ink3);text-transform:uppercase;white-space:nowrap}
.brand .bt{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat{margin-left:auto;text-align:right;min-width:0}
.stat .big{font:600 19px/1 var(--display);letter-spacing:.1em;color:var(--gold-hi);white-space:nowrap}
.stat .sub{font:500 10px var(--mono);letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.tb{display:flex;gap:8px;flex:none}
.fui{background:#f59e0b14;border:1px solid var(--gold-border);color:var(--gold-hi);font:600 11px var(--mono);letter-spacing:.06em;padding:7px 11px;border-radius:6px;min-height:32px;display:inline-flex;align-items:center;gap:6px;transition:.18s}
.fui:hover,.fui.on{background:var(--gold);color:#0b0701;border-color:var(--gold-hi);box-shadow:0 0 16px #f59e0b66}
.colour-menu input:disabled{opacity:.4;cursor:default}
.fui:disabled{opacity:.4;cursor:default;box-shadow:none;background:#f59e0b14;color:var(--gold-hi)}
.fui.pri{background:var(--gold);color:#150e00;border-color:var(--gold-hi)}
.fui.pri:hover{background:var(--gold-hi)}
.fui.ghost{background:none;border-color:#ffffff24;color:var(--ink2)}
.fui.ghost:hover{border-color:var(--gold-border-hot);color:var(--gold-hi);background:#f59e0b14;box-shadow:none}
.fui.danger{background:none;color:var(--bad);border-color:#fb8d7e66}
.fui.danger:hover{background:#fb8d7e22;color:#fff;box-shadow:none}

/* grid of panels */
#stage{flex:1;min-height:0;display:grid;gap:14px;padding:14px 20px 18px;position:relative;
  grid-template-columns:minmax(290px,340px) minmax(0,1fr) minmax(290px,350px);grid-template-rows:minmax(300px,46%) minmax(0,1fr);
  grid-template-areas:"orb mis att" "dock mis goals"}
#orbital-panel{grid-area:orb}#dock-panel{grid-area:dock}#center-panel{grid-area:mis}#att-panel{grid-area:att}#goals-panel{grid-area:goals}

.fpanel{position:relative;min-width:0;min-height:0;background:linear-gradient(180deg,#f59e0b0b 0,#07090ef0 22%),var(--panel);border:1px solid var(--gold-border);border-radius:8px;padding:13px 15px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 18px 48px #000c,inset 0 0 22px #f59e0b0d;transition:opacity .5s,transform .5s cubic-bezier(.16,1,.3,1),box-shadow .5s,border-color .5s}
.fpanel::before{content:"";position:absolute;top:0;left:14px;width:44px;height:2px;background:var(--gold-hi);box-shadow:0 0 10px var(--gold);pointer-events:none}
.fpanel::after{content:"";position:absolute;bottom:0;right:14px;width:44px;height:2px;background:var(--gold);opacity:.7;pointer-events:none}
.fpanel>.rl{position:absolute;pointer-events:none}
.rl.t{top:0;left:70px;right:16px;height:7px;border-bottom:1px dashed #f59e0b40;background:repeating-linear-gradient(90deg,#f59e0b40 0 1px,transparent 1px 8px) bottom/100% 4px no-repeat}
.rl.tr{top:14px;right:0;width:2px;height:34px;background:var(--gold-hi);opacity:.8;box-shadow:0 0 8px var(--gold)}
.rl.bl{bottom:14px;left:0;width:2px;height:34px;background:var(--gold);opacity:.7}
.rl.r{top:44px;bottom:48px;right:4px;width:5px;border-left:1px dashed #f59e0b38}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex:none;min-height:24px}
.panel-title{font:600 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:#fde68ae6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-note{font:500 10px var(--mono);letter-spacing:.08em;color:var(--ink3);white-space:nowrap}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#f59e0b44 transparent}

/* orbital core */
#orbital-panel{z-index:25}
.orbital-box{position:relative;flex:1;min-height:0;background:#000;border:1px solid #f59e0b3d;border-radius:6px;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
#tip{position:absolute;z-index:3;pointer-events:none;transform:translate(-50%,-100%);margin-top:-14px;background:#05070cf2;border:1px solid var(--gold-border-hot);border-radius:5px;padding:4px 9px;white-space:nowrap;font:600 11px var(--mono);letter-spacing:.08em;display:none;box-shadow:0 6px 20px #000}
#tip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
#tip s{text-decoration:none;color:var(--ink3);font-weight:400;margin-left:8px}
.orbital-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font:600 10.5px var(--mono);letter-spacing:.06em;color:var(--ink2);flex:none}
.orbital-foot span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fam-dots{display:inline-flex;gap:6px;flex:none}.fam-dots i{width:8px;height:8px;border-radius:50%;display:inline-block}
#orbital-panel .hint{font:400 9.5px var(--mono);letter-spacing:.14em;color:#7b879880;text-transform:uppercase;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* idle centre mode: the orbital panel glides to the middle, the others fade */
body.idle #dock-panel,body.idle #center-panel,body.idle #att-panel,body.idle #goals-panel{opacity:0;pointer-events:none;transform:scale(.97)}
body.idle #orbital-panel{position:fixed;--iw:min(900px,94vw);--ih:min(660px,calc(100dvh - 90px));left:calc(50% - var(--iw) / 2);top:calc(50% - var(--ih) / 2 + 28px);width:var(--iw);height:var(--ih);z-index:40;border-color:var(--gold-border-hot);box-shadow:0 30px 120px #000f,0 0 70px #f59e0b40}
body.idle .stat{opacity:.5}

.orbit-label{display:none;position:absolute;transform:translateX(-50%);pointer-events:none;color:var(--ink);font:600 10px var(--mono);letter-spacing:.1em;text-shadow:0 1px 5px #000;white-space:nowrap}

/* fleet dock */
.dock{display:flex;flex-direction:column;gap:8px;padding-right:3px}
.fam{border-left:2.5px solid var(--fc);background:#ffffff06;border-radius:0 6px 6px 0;padding:6px 6px 6px 9px;display:flex;flex-direction:column;gap:2px}
.fam-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 10.5px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--fc)}
.fam-head small{font:500 9.5px var(--mono);letter-spacing:.06em;color:var(--ink3);text-transform:none}
.dock-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 8px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:5px;padding:5px 7px;min-height:38px;color:var(--ink);transition:.15s}
.dock-item:hover{border-color:#f59e0b66;background:#f59e0b14}
.dock-item.sel{border-color:var(--gold-border-hot);background:#f59e0b24;box-shadow:inset 0 0 12px #f59e0b22}
.di-l{display:flex;align-items:center;gap:8px;min-width:0}
.di-n{font:600 13px var(--sans);white-space:nowrap}.di-m{font:400 10px var(--mono);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shape-svg{width:20px;height:20px;min-width:18px;min-height:18px;flex:none;overflow:visible}
.dock-state{font:600 9.5px var(--mono);letter-spacing:.04em;padding:2px 7px;border-radius:4px;white-space:nowrap;border:1px solid transparent}
.dock-state.orbiting{color:var(--gold-hi);background:#f59e0b29;border-color:#f59e0b73}
.dock-state.docked{color:var(--ok);background:#10b9811a;border-color:#10b9814d}
.dock-state.blocked{color:var(--bad);background:#fb8d7e1a;border-color:#fb8d7e66}
.dock-state.missing{color:var(--ink3);border-color:#ffffff1f}
.dock-state.limited{color:var(--warn);background:#fbbf241a;border-color:#fbbf2466}
.fold{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}.fold.open{display:block}
.att-lim{font:600 10.5px var(--mono);letter-spacing:.04em;color:var(--warn)}
.dock-item.missing .di-n,.dock-item.missing .shape-svg{opacity:.45}
.di-why{grid-column:1/-1;font:400 10.5px/1.45 var(--mono);color:var(--bad);overflow-wrap:anywhere}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);display:inline-block;margin-right:5px;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.agent-card{flex:none;margin-bottom:10px;border:1px solid var(--gold-border-hot);border-left:3px solid var(--fc);border-radius:6px;background:linear-gradient(180deg,#f59e0b1c,#0b0d12f0);padding:10px 11px}
.ac-h{display:flex;align-items:center;gap:8px;min-height:60px;flex-wrap:wrap}
.ac-h b{font:700 16px var(--display);letter-spacing:.1em;text-transform:uppercase}
.ac-h span{font:500 10px var(--mono);color:var(--fc);letter-spacing:.1em;text-transform:uppercase}
.ac-h button{margin-left:auto;background:none;border:0;color:var(--ink3);font-size:18px;line-height:1;padding:2px 6px}
.ac-g{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;margin:8px 0;font:400 11.5px/1.5 var(--mono)}
.ac-g dt{color:var(--ink3)}.ac-g dd{margin:0;overflow-wrap:anywhere}
.ac-note{margin:4px 0 8px;font:400 11.5px/1.5 var(--sans);color:var(--ink2)}
.ac-why{margin:4px 0 8px;font:400 11.5px/1.5 var(--mono);color:var(--bad)}

/* centre: mission stream and chat */
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink3);font:600 11.5px var(--display);letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;min-height:30px}
.tab.on{color:var(--gold-hi);border-bottom-color:var(--gold)}.tab:disabled{opacity:.35;cursor:default}
#stream{padding-right:4px}
.bubble{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:8px;background:#f59e0b0f;border:1px solid #f59e0b47;margin:0 0 10px;user-select:text;overflow-wrap:anywhere}
.avatar{flex:none;align-self:flex-start;border-top:1px solid var(--gold);border-left:2px solid var(--gold-hi);padding:3px 5px;color:var(--gold-hi);font:600 10px var(--mono);letter-spacing:.12em;background:#f59e0b0b}
.core-tools{display:flex;align-items:center;gap:6px}
.colour-control{position:relative}
.colour-control>summary{font:600 10px var(--mono);letter-spacing:0;border:1px solid var(--gold-border);border-radius:4px;padding:5px;list-style:none}
.colour-menu{position:absolute;right:0;top:30px;width:170px;padding:10px;background:#080a10;border:1px solid var(--gold-border-hot);border-radius:5px;z-index:10;box-shadow:0 8px 24px #000}
.colour-menu select{font:11px var(--mono);padding:4px;min-height:28px}
.colour-menu label{letter-spacing:.05em;margin:8px 0 4px}
.colour-menu input{width:100%;height:28px;background:transparent;border:1px solid var(--line);cursor:pointer}
#orbit-card{display:none}
body.idle #orbit-card:not(:empty){display:block;position:absolute;z-index:4;right:12px;bottom:12px;width:min(320px,calc(100% - 24px));max-height:70%;overflow:auto}
#orbit-card .agent-card{margin:0;background:#080a10f5}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.msg-v{padding:2px 4px 10px;user-select:text;overflow-wrap:anywhere;white-space:pre-wrap;color:var(--ink2)}
.msg-v .who{display:flex;align-items:center;gap:8px;font:600 13px var(--sans);color:var(--ink);margin-bottom:3px}
.msg-v .who small{font:400 10.5px var(--mono);color:var(--ink3)}
.msg-v.fail{color:var(--bad)}
.msg-v .act{display:block;font:400 11.5px var(--mono);color:var(--ok);margin-top:4px}.msg-v .act.no{color:var(--bad)}
.ev{margin:0 0 10px;padding:7px 12px;border-left:2px solid var(--gold);background:#ffffff05;font:400 12px var(--mono);color:var(--ink2);overflow-wrap:anywhere}
.ev em,.msg-v em{font-style:normal;color:var(--gold-hi)}
.lk{background:none;border:0;border-bottom:1px solid var(--gold);color:var(--gold-hi);font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:0 0 1px;margin-left:8px}
.thk{font:400 11px var(--mono);letter-spacing:.08em;color:var(--gold);text-transform:uppercase;padding:2px 4px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.center-dock{flex:none;margin-top:8px}
.cmd-bar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:#0a0d14f0;border:1px solid var(--gold-border);border-radius:8px}
.cmd-bar:focus-within{border-color:var(--gold-hi);box-shadow:0 0 18px #f59e0b38}
.attach-tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}.file-chip{display:inline-flex;align-items:center;gap:7px;padding:4px 7px;border:1px solid var(--gold-border);border-radius:5px;background:#0a0d14;color:var(--ink2);font:10px var(--mono);max-width:100%;overflow-wrap:anywhere}.file-chip img{width:30px;height:30px;object-fit:cover;border-radius:3px}.file-chip button{border:0;background:none;color:var(--bad);padding:2px 5px}.file-chip .progress{height:2px;background:var(--gold);display:block}.attach-zone.dragover{outline:1px dashed var(--gold-hi);outline-offset:2px}
.cmd-bar>span{color:var(--gold);font:500 15px var(--mono)}
#in{flex:1;min-width:0;background:none;border:0;outline:0;font:400 14px var(--sans);padding:6px 0}
#in::placeholder{color:var(--ink3)}
#go{background:linear-gradient(90deg,#f59e0b,#fbbf24);border:0;color:#0b0701;font:700 12.5px var(--sans);padding:8px 16px;border-radius:6px;box-shadow:0 0 16px #f59e0b59;min-height:34px}
#go:disabled{opacity:.45;box-shadow:none}
.busy-line{height:2px;margin-bottom:6px;background:linear-gradient(90deg,transparent,var(--gold),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:sweep 1.4s linear infinite;opacity:0}
body.think .busy-line{opacity:1}
@keyframes sweep{from{background-position:-40% 0}to{background-position:140% 0}}

/* goal view inside the stream */
.gh{display:flex;align-items:flex-start;gap:8px}
.gh h2{margin:0;font:700 20px/1.2 var(--display);letter-spacing:.05em;overflow-wrap:anywhere}
.gh button.x{margin-left:auto;background:none;border:0;color:var(--ink3);font-size:20px;line-height:1;padding:2px 6px}
.pill{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border:1px solid #ffffff2b;border-radius:99px;color:var(--ink3);white-space:nowrap;display:inline-block;text-decoration:none}
.pill.run{color:var(--gold-hi);border-color:#f59e0b80;background:#f59e0b1c}.pill.you{color:#150e00;background:var(--gold);border-color:var(--gold-hi)}
.pill.good{color:var(--ok);border-color:#34d39966;background:#10b9811a}.pill.bad{color:var(--bad);border-color:#fb8d7e66;background:#fb8d7e14}
.chip{display:inline-flex;align-items:center;gap:7px;font:600 13px var(--display);letter-spacing:.12em;text-transform:uppercase}
.chip .shape-svg{width:20px;height:20px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 4px}
.hop{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:5px;padding:3px 9px}
.hop.on{border-color:var(--gold);box-shadow:0 0 14px #f59e0b40}
.tdot{width:6px;height:6px;border-radius:50%}.arrow{color:var(--ink3);font-family:var(--mono)}
.card{position:relative;border:1px solid var(--line);border-radius:7px;background:#ffffff04;padding:10px 12px;margin:12px 0;min-width:0}
.card.you{border-color:var(--gold-border-hot);background:linear-gradient(180deg,#f59e0b1a,#0b0d12f0)}
.card.fin{border-color:#34d39980;background:linear-gradient(180deg,#10b9811a,#0b0d12f0)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:400 12.5px/1.6 var(--mono);margin:8px 0 0;color:#d7cdb8;user-select:text}
pre.lv{background:#0007;border:1px solid var(--line);padding:10px;max-height:260px;overflow:auto;border-radius:5px}
.msgf{max-height:15em;overflow:hidden;position:relative}.msgf.open{max-height:none}
.msgf:not(.open)::after{content:"";position:absolute;inset:auto 0 0 0;height:3em;background:linear-gradient(transparent,#080a10)}
details>summary{cursor:pointer;font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:4px 0;list-style-position:inside}
details>summary:hover{color:var(--gold-hi)}
.diff{margin-top:6px;border:1px solid #f59e0b3d;border-radius:6px;background:#04060af5;overflow:auto;max-height:340px;font:11.5px/1.55 var(--mono);padding:6px 0;user-select:text}
.diff div{white-space:pre;padding:0 12px;min-width:max-content}
.diff .add{background:#10b98126;color:#6ee7b7}.diff .del{background:#ef444426;color:#fca5a5}.diff .hunk{color:var(--gold-hi);background:#f59e0b12}.diff .meta{color:var(--ink3)}
label{display:block;font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:12px 0 5px}
input[type=text],input[type=number],select,textarea{width:100%;background:#0007;border:1px solid var(--line);border-radius:5px;padding:8px 10px;font:400 14px var(--sans);min-height:34px}
select{background:#0a0b0d}
textarea{min-height:76px;resize:vertical}
select.sm,input.sm{width:auto;max-width:100%;padding:5px 8px;font-size:12.5px;min-height:30px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{margin:0;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:5px;padding:5px 10px;color:var(--ink);cursor:pointer;letter-spacing:.06em}
.err{color:var(--bad);margin-top:8px;min-height:1.2em;font:400 12px var(--mono);overflow-wrap:anywhere}
dialog{background:#06080d;color:var(--ink);border:1px solid var(--gold-border-hot);border-radius:8px;padding:20px;width:min(620px,calc(100vw - 20px));max-height:calc(100dvh - 20px);overflow:auto;box-shadow:0 30px 90px #000}
dialog::backdrop{background:#000c}
dialog h2{margin:0 0 4px;font:700 20px var(--display);letter-spacing:.24em;text-transform:uppercase}

/* attention and goals */
.att-card{position:relative;border:1px solid var(--gold-border-hot);border-radius:8px;padding:11px 12px;margin-bottom:10px;background:linear-gradient(180deg,#f59e0b24,#140e07f0);box-shadow:inset 0 0 20px #f59e0b14}
.att-card.fin{border-color:#34d39999;background:linear-gradient(180deg,#10b98122,#07120dee);box-shadow:inset 0 0 20px #10b98112}
.att-sub{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}.att-card.fin .att-sub{color:var(--ok)}

  el.type = 'button';
  el.className = 'sat';
  el.setAttribute('aria-label', `${id}: tap to inspect, drag or fling to move in 3D`);
  el.innerHTML = `<span class="sat-lbl">${esc(id.toUpperCase())}</span>`;
  box.appendChild(el);
  bindSatEvents(el, id);

  return { g, innerG, outerG, mat, pts, ptsMat, el, label: el.firstChild };
}

// ------------------------------------------------------------ Interactive Satellite Grabbing & Flinging + Spring-Tether Physics
const dock = new THREE.Group(); scene.add(dock);
const mods = new Map();
let activeSatDrag = null;

function startSatDrag(id, e) {
  const m = mods.get(id); if (!m) return;
  const r = cv.getBoundingClientRect();
  activeSatDrag = {
    id, pointerId: e.pointerId,
    startX: e.clientX, startY: e.clientY,
    lx: e.clientX, ly: e.clientY,
    vx: 0, vy: 0, moved: 0,
    boxW: r.width || W, boxH: r.height || H,
    boxLeft: r.left, boxTop: r.top
  };
  m.el.classList.add('dragging');
}

function moveSatDrag(e) {
  if (!activeSatDrag || activeSatDrag.pointerId !== e.pointerId) return false;
  const d = activeSatDrag, m = mods.get(d.id);
  if (!m) return false;
  const dx = e.clientX - d.lx, dy = e.clientY - d.ly;
  d.lx = e.clientX; d.ly = e.clientY;
  d.moved += Math.abs(dx) + Math.abs(dy);
  d.vx = d.vx * .4 + dx * .6;
  d.vy = d.vy * .4 + dy * .6;
  if (d.moved > 5) {
    const depth = cam.position.z - m.w.z;
    const worldPerPx = 2 * Math.tan(cam.fov * Math.PI / 360) * depth / Math.max(1, H);
    const dw = [dx * worldPerPx, -dy * worldPerPx, 0];
    const dl = unrotate(IN.rotMat, dw);
    m.dragOffset[0] = clamp(m.dragOffset[0] + dl[0], -2.6, 2.6);
    m.dragOffset[1] = clamp(m.dragOffset[1] + dl[1], -2.6, 2.6);
    m.dragOffset[2] = clamp(m.dragOffset[2] + dl[2], -2.6, 2.6);
    m.springVel[0] = m.springVel[1] = m.springVel[2] = 0;
  }
  return true;
}

function endSatDrag(e) {
  if (!activeSatDrag || activeSatDrag.pointerId !== e.pointerId) return false;
  const d = activeSatDrag, m = mods.get(d.id);
  activeSatDrag = null;
  if (m) m.el.classList.remove('dragging');
  if (d.moved < 6 && e.type === 'pointerup') {
    selectAgent(d.id);
  } else if (m) {
    const depth = cam.position.z - m.w.z;
    const worldPerPx = 2 * Math.tan(cam.fov * Math.PI / 360) * depth / Math.max(1, H);
    const fw = [clamp(d.vx * worldPerPx * 18, -6, 6), clamp(-d.vy * worldPerPx * 18, -6, 6), 0];
    const fl = unrotate(IN.rotMat, fw);
    m.springVel[0] += fl[0]; m.springVel[1] += fl[1]; m.springVel[2] += fl[2];
    m.orbVel = clamp(m.orbVel + (d.vx * .018 - d.vy * .008), -1.8, 1.8);
    emitWave(m.w, m.col, .9);
  }
  return true;
}

function bindSatEvents(el, id) {
  el.addEventListener('pointerenter', () => { IN.hover = id; });
  el.addEventListener('pointerleave', () => { if (IN.hover === id) IN.hover = null; });
  el.addEventListener('pointerdown', e => {
    e.stopPropagation();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    startSatDrag(id, e);
  });
  el.addEventListener('pointermove', e => { if (moveSatDrag(e)) e.stopPropagation(); });
  el.addEventListener('pointerup', e => { if (endSatDrag(e)) e.stopPropagation(); });
  el.addEventListener('pointercancel', e => { if (endSatDrag(e)) e.stopPropagation(); });
  el.addEventListener('wheel', e => { e.preventDefault(); IN.zoomT = clamp(IN.zoomT * Math.exp(e.deltaY * .0012), .55, 1.7); }, { passive: false });
}

function addAgent(ag) {

  const o = build3DSatelliteConstruct(ag.id, col); o.g.visible = false; dock.add(o.g);
  const m = 44, bp = [], bi = [], bc = []; for (let k = 0; k <= m; k++) { bp.push(0, 0, 0); bi.push(1); bc.push(k / m); }
  const beam = new THREE.Line(geo(bp, bi, bc), new THREE.ShaderMaterial(Object.assign({ uniforms: { uT: { value: c }, uA: U.uA, uB: U.uB, uTime: U.uTime, uOn: { value: 0 } },
    vertexShader: 'attribute float aC;varying float vT;void main(){vT=aC;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: 'uniform vec3 uT,uA,uB;uniform float uTime,uOn;varying float vT;void main(){float f=pow(fract(vT*3.5-uTime*1.35),8.);float b=pow(fract(vT*3.5+uTime*1.35),8.);float endFade=sin(vT*3.14159);vec3 col=mix(uB,uT,.45);float d=(.30+2.3*(f+b))*endFade;gl_FragColor=vec4(col*d*uOn,1.);}' }, add)));

const reticleLine = (col, segs = 4) => {

function emitWave(pos, colHex, strength = 1) {

function setCoreColour(value, remember = true, fromPreset = false) {

    THEME.coreOut = value;

    const sec = new THREE.Color().setHSL((hsl.h + .06) % 1, clamp(hsl.s * 1.1, .35, 1), clamp(hsl.l + .24, .55, .82));
    const hrt = sec.clone().lerp(new THREE.Color('#ffffff'), .72);

    THEME.coreHeart = '#' + hrt.getHexString();
    const match = [...$('core-preset').options].find(o => o.value.toLowerCase() === key);
    $('core-preset').value = match ? match.value : 'custom';

}

  try {
    if ($('f-proj').checked) {
      const p = await api('/api/projects', { title: '', objective: $('f-goal').value, repo: $('f-repo').value.trim(), lead: $('f-lead').value, test_cmd: $('f-test').value, auto_start: false });
      S.files.newgoal = []; $('dlg').close(); S.proj = p.id; await loadProject(S.proj); tick(); return;
    }
    const g = await api('/api/goals', { repo: $('f-repo').value.trim(), objective: $('f-goal').value, test_cmd: $('f-test').value, lead: $('f-lead').value,
      team: $('f-team-mode').value === 'auto' ? 'auto' : [...document.querySelectorAll('#f-team input:checked')].map(x => x.value), mode: $('f-mode').value, cap: +$('f-cap').value, attachments:fileIds('newgoal') });
    S.files.newgoal=[];
    $('dlg').close(); selectGoal(g.id);
  } catch (err) { $('f-err').textContent = err.message; $('f-go').disabled = false; }
});
</script>
</body>
</html>
